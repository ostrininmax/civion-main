services:
  db:
    image: postgres:16
    container_name: civic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: civic
    ports:
      - "5432:5432"
    volumes:
      - civic_pg_data:/var/lib/postgresql/data

volumes:
  civic_pg_data:
